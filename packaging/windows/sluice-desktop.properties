# The window, a second launcher of the one sluice install (packaging/windows/jpackage.txt): sluice-desktop.exe beside
# sluice.exe, on the same Java runtime. It alone gets the Start menu entry and the desktop shortcut; the command is
# run from a terminal.
main-jar=sluice-desktop-all.jar
main-class=com.botmaker.sluice.desktop.Launcher
description=The sluice window: releases a Maven umbrella split over git submodules.
icon=desktop/src/main/resources/icons/icon.ico
java-options=--enable-native-access=ALL-UNNAMED
win-console=false
win-menu=true
win-shortcut=true
